[package]
name = "venturi-cfd"
version = "0.3.0"
description = "Venturi — Native Rust Desktop CFD Engineering Studio & MCP Server for OpenFOAM"
authors = ["Venturi Engineering"]
license = "MIT"
edition = "2021"
rust-version = "1.78"
default-run = "venturi-cfd"

[lib]
name = "venturi_cfd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "venturi-cfd"
path = "src/main.rs"

[[bin]]
name = "venturi-mcp"
path = "src/bin/venturi_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
