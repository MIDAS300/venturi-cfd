name: Build Venturi CFD (Windows x64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Build venturi-mcp.exe
        working-directory: src-tauri
        run: cargo build --release --bin venturi-mcp
      - name: Build Tauri Windows NSIS installer & venturi-cfd.exe
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venturi-cfd-windows-x64
          path: |
            src-tauri/target/release/venturi-cfd.exe
            src-tauri/target/release/venturi-mcp.exe
            src-tauri/target/release/bundle/nsis/*.exe
